name: Restore KomariX frontends
description: Download and unpack previously built KomariX frontend artifacts.

inputs:
  artifact-name:
    description: Frontend artifact name.
    default: komarix-frontend

runs:
  using: composite
  steps:
    - name: Download frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/frontend-artifact

    - name: Extract frontend artifact
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf web/public/defaultTheme web/public/purcarteTheme
        mkdir -p web/public
        tar -xzf "$RUNNER_TEMP/frontend-artifact/${{ inputs.artifact-name }}.tar.gz" -C web/public
