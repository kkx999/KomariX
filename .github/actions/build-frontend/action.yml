name: Build frontend theme
description: Build the KomariX default theme from the upstream Komari 1.4.3 frontend.

inputs:
  node-version:
    description: Node.js version used to build komari-web.
    default: "23"
  repository:
    description: komari-web repository URL.
    default: https://github.com/komari-monitor/komari-web
  ref:
    description: Upstream komari-web ref to build.
    default: "1.4.3"
  artifact-name:
    description: Optional artifact name for the packed frontend theme.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Clone and build frontend
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf komari-web
        FRONTEND_REF="${{ inputs.ref }}"
        if [ -z "$FRONTEND_REF" ]; then
          FRONTEND_REF="1.4.3"
        fi
        git clone --depth=1 --branch "$FRONTEND_REF" "${{ inputs.repository }}" komari-web

        # Keep Komari 1.4.3 frontend behavior, but route Agent installation
        # through the KomariX branded installer wrapper.
        find komari-web/src -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) -print0 | \
          xargs -0 -r sed -i \
            's#https://raw.githubusercontent.com/komari-monitor/komari-agent/refs/heads/main/#https://raw.githubusercontent.com/kkx999/KomariX/main/agent/#g'

        cd komari-web
        npm install
        npm run build
        cd ..

        # KomariX branding only. Keep upstream 1.4.3 application logic unchanged.
        find komari-web/dist -type f \( -name '*.js' -o -name '*.html' -o -name '*.json' -o -name '*.css' -o -name '*.webmanifest' \) -print0 | \
          xargs -0 -r sed -i 's/Komari/KomariX/g'

        mkdir -p komari-web/dist/assets
        cp -f docs/komarix.svg komari-web/dist/assets/komarix.svg

        # Replace brand artwork references only.
        find komari-web/dist -type f \( -name '*.js' -o -name '*.html' -o -name '*.json' -o -name '*.webmanifest' \) -print0 | \
          xargs -0 -r sed -i \
            -e 's#assets/logo\.png#assets/komarix.svg#g' \
            -e 's#/assets/pwa-icon\.png#/assets/komarix.svg#g' \
            -e 's#favicon\.ico#assets/komarix.svg#g'

        mkdir -p web/public/defaultTheme/dist
        rm -rf web/public/defaultTheme/dist/*
        cp -r komari-web/dist/* web/public/defaultTheme/dist/
        cp -f komari-web/komari-theme.json web/public/defaultTheme/
        sed -i 's/Komari/KomariX/g' web/public/defaultTheme/komari-theme.json
        if [ -f komari-web/preview.png ]; then cp -f komari-web/preview.png web/public/defaultTheme/; fi
        if [ -f komari-web/perview.png ]; then cp -f komari-web/perview.png web/public/defaultTheme/; fi
        if [ -f web/public/defaultTheme/preview.png ] && [ ! -f web/public/defaultTheme/perview.png ]; then cp -f web/public/defaultTheme/preview.png web/public/defaultTheme/perview.png; fi
        if [ -f web/public/defaultTheme/perview.png ] && [ ! -f web/public/defaultTheme/preview.png ]; then cp -f web/public/defaultTheme/perview.png web/public/defaultTheme/preview.png; fi

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" -C web/public/defaultTheme .

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
