name: Build KomariX frontends
description: Build the vendored KomariX admin frontend and built-in PurCarte theme.

inputs:
  node-version:
    description: Node.js version used to build frontends.
    default: "23"
  artifact-name:
    description: Optional artifact name for the packed frontend bundle.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build KomariX admin frontend
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf .build/komarix-web
        mkdir -p .build
        cp -a components/komarix-web .build/komarix-web

        cd .build/komarix-web
        npm install
        npm run build
        cd ../..


        mkdir -p .build/komarix-web/dist/assets
        cp -f docs/komarix.svg .build/komarix-web/dist/assets/komarix.svg

        find .build/komarix-web/dist -type f \( -name '*.js' -o -name '*.html' -o -name '*.json' -o -name '*.webmanifest' \) -print0 | \
          xargs -0 -r sed -i \
            -e 's#assets/logo\.png#assets/komarix.svg#g' \
            -e 's#/assets/pwa-icon\.png#/assets/komarix.svg#g' \
            -e 's#favicon\.ico#assets/komarix.svg#g'

        rm -rf web/public/defaultTheme
        mkdir -p web/public/defaultTheme/dist
        cp -r .build/komarix-web/dist/* web/public/defaultTheme/dist/
        cp -f .build/komarix-web/komari-theme.json web/public/defaultTheme/
        if [ -f .build/komarix-web/preview.png ]; then cp -f .build/komarix-web/preview.png web/public/defaultTheme/; fi
        if [ -f .build/komarix-web/perview.png ]; then cp -f .build/komarix-web/perview.png web/public/defaultTheme/; fi
        if [ -f web/public/defaultTheme/preview.png ] && [ ! -f web/public/defaultTheme/perview.png ]; then cp -f web/public/defaultTheme/preview.png web/public/defaultTheme/perview.png; fi
        if [ -f web/public/defaultTheme/perview.png ] && [ ! -f web/public/defaultTheme/preview.png ]; then cp -f web/public/defaultTheme/perview.png web/public/defaultTheme/preview.png; fi

    - name: Build built-in KomariX PurCarte theme
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf .build/komarix-theme-purcarte
        mkdir -p .build
        cp -a components/komarix-theme-purcarte .build/komarix-theme-purcarte

        mkdir -p .build/komarix-theme-purcarte/public/assets
        cp -f docs/komarix.svg .build/komarix-theme-purcarte/public/assets/komarix.svg

        # Use KomariX logo/title in the built-in copy.
        find .build/komarix-theme-purcarte/src -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) -print0 | \
          xargs -0 -r sed -i \
            -e 's#/assets/logo\.png#/assets/komarix.svg#g'

        cd .build/komarix-theme-purcarte
        npm install
        npm run build
        cd ../..


        rm -rf web/public/purcarteTheme
        mkdir -p web/public/purcarteTheme/dist
        cp -r .build/komarix-theme-purcarte/dist/* web/public/purcarteTheme/dist/
        cp -f .build/komarix-theme-purcarte/komari-theme.json web/public/purcarteTheme/
        if [ -f .build/komarix-theme-purcarte/preview.png ]; then cp -f .build/komarix-theme-purcarte/preview.png web/public/purcarteTheme/; fi

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" \
          -C web/public defaultTheme purcarteTheme

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
