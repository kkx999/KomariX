name: KomariX source cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-komarix-source.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite runtime branding and fresh-install names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path(".")

          # Component-local upstream CI is not used in the monorepo and still
          # carries old project automation. Remove it from the maintained tree.
          for p in [
              Path("components/komarix-web/.github"),
              Path("components/komarix-agent/.github"),
              Path("components/komarix-theme-purcarte/.github"),
          ]:
              if p.exists():
                  shutil.rmtree(p)

          text_exts = {
              ".go", ".ts", ".tsx", ".js", ".jsx", ".json", ".md", ".txt",
              ".sh", ".ps1", ".yml", ".yaml", ".html", ".css", ".toml",
              ".ini", ".conf", ".py", ".mod", ".gitignore"
          }

          def is_text_target(p: Path) -> bool:
              if not p.is_file():
                  return False
              if p.name in {"LICENSE", "NOTICE"}:
                  return False
              if str(p).startswith("market/"):
                  return False
              if str(p) == "components/SOURCES.md":
                  return False
              if str(p).startswith(".github/workflows/"):
                  return False
              return p.suffix.lower() in text_exts or p.name in {"go.mod", "go.sum", ".gitignore"}

          universal = [
              ("https://raw.githubusercontent.com/komari-monitor/komari-agent/refs/heads/main/", "https://raw.githubusercontent.com/kkx999/KomariX/main/agent/"),
              ("https://raw.githubusercontent.com/komari-monitor/komari/refs/heads/main/README.md", "https://raw.githubusercontent.com/kkx999/KomariX/main/README.md"),
              ("https://github.com/komari-monitor/komari/blob/main/README.md", "https://github.com/kkx999/KomariX/blob/main/README.md"),
              ("https://api.github.com/repos/komari-monitor/komari/releases", "https://api.github.com/repos/kkx999/KomariX/releases"),
              ("ghcr.io/komari-monitor/komari-agent", "ghcr.io/kkx999/komarix-agent"),
              ("github.com/komari-monitor/komari-agent", "github.com/kkx999/KomariX/components/komarix-agent"),
              ("github.com/komari-monitor/komari", "github.com/kkx999/KomariX"),
              ("https://komari-document.pages.dev/en/faq/uninstall", "https://github.com/kkx999/KomariX"),
              ("https://komari-document.pages.dev/faq/notification-template.html", "https://github.com/kkx999/KomariX"),
              ("/opt/komari-agent", "/opt/komarix-agent"),
              ("/opt/komari/", "/opt/komarix/"),
              ("komari-agent.service", "komarix-agent.service"),
              ("komari.service", "komarix.service"),
              ("komari.db", "komarix.db"),
              ("komari-backup-markup", "komarix-backup-markup"),
              ("komari-market-", "komarix-market-"),
              ("KOMARI_", "KOMARIX_"),
              ("X-Komari-", "X-KomariX-"),
              ("Komari Monitor", "KomariX Monitor"),
              ("Komari Agent", "KomariX Agent"),
              ("Komari agent", "KomariX Agent"),
              ("[Komari]", "[KomariX]"),
              ("Komari.Monitor.Agent", "KomariX.Monitor.Agent"),
          ]

          for p in root.rglob("*"):
              if not is_text_target(p):
                  continue
              try:
                  s = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              original = s
              for a, b in universal:
                  s = s.replace(a, b)

              sp = str(p)

              if sp.startswith("components/komarix-web/"):
                  # UI/product branding, while keeping komari-theme.json as the
                  # ecosystem manifest filename.
                  s = s.replace("komari-agent", "komarix-agent")
                  s = re.sub(r"\bKomari\b", "KomariX", s)
                  s = s.replace("https://github.com/komari-monitor", "https://github.com/kkx999/KomariX")

              if sp.startswith("components/komarix-agent/"):
                  s = s.replace("komari-agent", "komarix-agent")
                  s = s.replace("komari-motd", "komarix-motd")
                  s = s.replace(".komari-", ".komarix-")
                  s = s.replace("komari-task-", "komarix-task-")
                  s = s.replace("komari-upload-", "komarix-upload-")
                  s = re.sub(r"\bKomari\b", "KomariX", s)
                  s = re.sub(r"\bkomari\b", "komarix", s)

              if sp.startswith("components/komarix-theme-purcarte/"):
                  s = re.sub(r"\bKomari\b", "KomariX", s)
                  s = s.replace("komari-theme-config.json", "komarix-theme-config.json")

              # Root runtime names that are not external theme/plugin contracts.
              if (
                  sp.startswith("database/")
                  or sp.startswith("cmd/")
                  or sp.startswith("web/")
                  or sp.startswith("protocol/")
                  or sp.startswith("pkg/")
                  or sp.startswith("utils/")
              ):
                  s = s.replace("komari-motd", "komarix-motd")
                  s = s.replace(".komari-", ".komarix-")
                  s = s.replace("komari-task-", "komarix-task-")
                  s = s.replace("komari-upload-", "komarix-upload-")
                  s = re.sub(r"\bKomari Monitor\b", "KomariX Monitor", s)

              # User-facing plugin compatibility errors should name KomariX,
              # while manifest filename/key remain compatible with the market.
              if sp.startswith("internal/plugin/"):
                  s = s.replace("invalid komari version constraint", "invalid KomariX version constraint")
                  s = s.replace("plugin requires komari ", "plugin requires KomariX ")

              if s != original:
                  p.write_text(s, encoding="utf-8")

          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source cleanup changes."
            exit 0
          fi
          git commit -m "refactor: complete KomariX fresh-install naming [skip ci]"
          git push origin HEAD:main
