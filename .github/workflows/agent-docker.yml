name: Publish KomariX Agent Docker

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kkx999/komarix-agent

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: components/komarix-agent/go.mod
          cache-dependency-path: components/komarix-agent/go.sum

      - name: Build Linux Agent binaries
        shell: bash
        env:
          CGO_ENABLED: 0
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euxo pipefail
          if [ -z "$VERSION" ]; then
            VERSION="dev"
          fi
          cd components/komarix-agent
          LDFLAGS="-s -w -X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari-agent/update.Repo=kkx999/KomariX"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o komarix-agent-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o komarix-agent-linux-arm64 .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest

      - name: Build and push Agent image
        uses: docker/build-push-action@v5
        with:
          context: components/komarix-agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
