name: Attach v1.0.0 release assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/attach-release-v1.0.0.yml"

permissions:
  actions: read
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified multi-platform binaries
        uses: actions/download-artifact@v4
        with:
          run-id: 35307449836
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
          merge-multiple: true

      - name: Attach binaries to v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -al artifacts
          find artifacts -maxdepth 1 -type f \( -name 'komari-linux-*' -o -name 'komari-windows-*' \) -print0 \
            | xargs -0 -r gh release upload v1.0.0 --repo "${GITHUB_REPOSITORY}" --clobber
