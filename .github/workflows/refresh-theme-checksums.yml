name: Refresh direct theme checksums

on:
  push:
    branches:
      - main
    paths:
      - ".github/refresh-theme-checksums.trigger"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recalculate and validate author theme releases
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import time
          import urllib.request
          import zipfile
          from io import BytesIO
          from pathlib import Path

          path = Path("market/theme-v1.json")
          raw = json.loads(path.read_text(encoding="utf-8"))
          themes = raw if isinstance(raw, list) else raw.get("themes", [])

          def download(url):
              last = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={
                          "User-Agent": "KomariX-Theme-Market-Checksum/1.0",
                          "Accept": "*/*",
                      })
                      with urllib.request.urlopen(req, timeout=120) as resp:
                          return resp.read()
                  except Exception as exc:
                      last = exc
                      if attempt < 3:
                          time.sleep(2 * (attempt + 1))
              raise last

          def read_manifest(data):
              with zipfile.ZipFile(BytesIO(data)) as zf:
                  names = [n.replace("\\", "/") for n in zf.namelist()]
                  candidates = []
                  for preferred in ("komarix-theme.json", "komari-theme.json"):
                      if preferred in names:
                          candidates = [preferred]
                          break
                  if not candidates:
                      by_root = {}
                      for n in names:
                          parts = n.split("/")
                          if len(parts) == 2 and parts[1] in ("komarix-theme.json", "komari-theme.json") and parts[0]:
                              by_root.setdefault(parts[0], []).append(n)
                      if len(by_root) != 1:
                          raise RuntimeError("cannot determine a unique theme manifest")
                      entries = next(iter(by_root.values()))
                      entries.sort(key=lambda n: 0 if n.endswith("/komarix-theme.json") else 1)
                      candidates = [entries[0]]
                  with zf.open(candidates[0]) as fp:
                      return json.loads(fp.read().decode("utf-8"))

          failures = []
          for i, theme in enumerate(themes, 1):
              short = str(theme.get("short", ""))
              version = str(theme.get("version", ""))
              url = str(theme.get("download", ""))
              try:
                  data = download(url)
                  digest = hashlib.sha256(data).hexdigest()
                  manifest = read_manifest(data)
                  manifest_short = str(manifest.get("short", ""))
                  manifest_version = str(manifest.get("version", ""))
                  if manifest_short != short:
                      raise RuntimeError(f"manifest short={manifest_short!r}, catalog short={short!r}")
                  if manifest_version != version:
                      raise RuntimeError(f"manifest version={manifest_version!r}, catalog version={version!r}")
                  theme["sha256"] = digest
                  print(f"[OK] {i:02d}/{len(themes)} {short} {version} {digest}")
              except Exception as exc:
                  failures.append(f"{short} {version}: {exc}")
                  print(f"[FAIL] {short} {version}: {exc}")

          if failures:
              raise SystemExit("Theme validation failed:\n" + "\n".join(failures))

          if len(themes) != 49:
              raise SystemExit(f"Safety stop: expected 49 themes, found {len(themes)}")

          if not isinstance(raw, list):
              raw["updated_at"] = __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat().replace("+00:00", "Z")

          path.write_text(json.dumps(raw, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit refreshed checksums
        run: |
          set -euo pipefail
          if git diff --quiet -- market/theme-v1.json; then
            echo "No checksum changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market/theme-v1.json
          git commit -m "market: refresh author theme checksums"
          git push
