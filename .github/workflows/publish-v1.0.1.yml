name: Verify and publish KomariX v1.0.1

on:
  push:
    branches:
      - main
    paths:
      - "release-v1.0.1.trigger"

permissions:
  contents: write
  packages: write

env:
  VERSION: v1.0.1

jobs:
  build-frontends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build KomariX frontend
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: komarix-frontends-v1.0.1

  test-panel:
    needs: build-frontends
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore frontend
        uses: ./.github/actions/restore-frontend
        with:
          artifact-name: komarix-frontends-v1.0.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run panel tests
        shell: bash
        run: |
          set -euo pipefail
          go list ./... | grep -v '^github.com/kkx999/KomariX/pkg/jsruntime$' | xargs go test

      - name: Build panel verification binary
        env:
          CGO_ENABLED: 1
          GIN_MODE: release
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath \
            -ldflags="-s -w -X github.com/kkx999/KomariX/utils.CurrentVersion=${VERSION} -X github.com/kkx999/KomariX/utils.VersionHash=${GITHUB_SHA}" \
            -o /tmp/komarix-linux-amd64 .

  test-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: components/komarix-agent/go.mod
          cache: false

      - name: Run Agent tests
        shell: bash
        run: |
          set -euo pipefail
          cd components/komarix-agent
          go test ./...

      - name: Verify remote shell removal
        shell: bash
        run: |
          set -euo pipefail
          test ! -e components/komarix-web/src/pages/admin/exec.tsx
          test ! -d components/komarix-web/src/pages/terminal
          test ! -d components/komarix-agent/terminal
          test ! -d web/api/terminal
          test ! -e web/rpc/jsonrpc/admin.task.go
          test ! -e web/rpc/jsonrpc/admin.xtermjs.go
          if grep -q '"@xterm/' components/komarix-web/package.json; then
            echo "Obsolete xterm dependency remains."
            exit 1
          fi

  build-panel:
    needs: [build-frontends, test-panel]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            zig_target_triple: x86_64-windows-gnu
            binary_extension: .exe
          - goos: windows
            goarch: arm64
            zig_target_triple: aarch64-windows-gnu
            binary_extension: .exe
          - goos: windows
            goarch: 386
            zig_target_triple: x86-windows-gnu
            binary_extension: .exe
          - goos: linux
            goarch: amd64
            zig_target_triple: x86_64-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: arm64
            zig_target_triple: aarch64-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: 386
            zig_target_triple: x86-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: riscv64
            zig_target_triple: riscv64-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: loong64
            zig_target_triple: loongarch64-linux-musl
            binary_extension: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore frontend
        uses: ./.github/actions/restore-frontend
        with:
          artifact-name: komarix-frontends-v1.0.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Zig
        uses: ./.github/actions/setup-zig

      - name: Build panel
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target_triple }}
          GIN_MODE: release
        shell: bash
        run: |
          set -euo pipefail
          BINARY_NAME="komarix-${GOOS}-${GOARCH}${{ matrix.binary_extension }}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/kkx999/KomariX/utils.CurrentVersion=${VERSION} -X github.com/kkx999/KomariX/utils.VersionHash=${GITHUB_SHA}" \
            -o "${BINARY_NAME}" .

      - name: Upload panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komarix-${{ matrix.goos }}-${{ matrix.goarch }}*

  build-agent:
    needs: test-agent
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: components/komarix-agent/go.mod
          cache: false

      - name: Build Agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          set -euo pipefail
          cd components/komarix-agent
          BINARY_NAME="komarix-agent-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -trimpath \
            -ldflags="-s -w -X github.com/kkx999/KomariX/components/komarix-agent/update.CurrentVersion=${VERSION} -X github.com/kkx999/KomariX/components/komarix-agent/update.Repo=kkx999/KomariX" \
            -o "../../${BINARY_NAME}" .

      - name: Upload Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komarix-agent-${{ matrix.goos }}-${{ matrix.goarch }}*

  publish:
    needs: [build-panel, build-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum komarix-* | sort -k2 > SHA256SUMS

      - name: Publish formal v1.0.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Replacing incomplete or previous ${VERSION} release."
            gh release delete "${VERSION}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          fi

          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "KomariX v1.0.1" \
            --notes "KomariX v1.0.1：移除 Web 终端与远程命令执行能力，并清理相关终端依赖；修复 Agent 更新测试中的旧仓库断言；网络探测测试改为可重复的本地测试，特权 ICMP 独立为显式集成测试。发布前已重新执行 Panel/Agent 测试和全部正式多架构构建。" \
            artifacts/komarix-* \
            artifacts/SHA256SUMS

  publish-panel-docker:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux panel binaries
        uses: actions/download-artifact@v4
        with:
          pattern: panel-linux-*
          path: .
          merge-multiple: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push panel image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/kkx999/komarix:v1.0.1
            ghcr.io/kkx999/komarix:latest
          provenance: false

  publish-agent-docker:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: components/komarix-agent/go.mod
          cache: false

      - name: Build Agent Docker binaries
        env:
          CGO_ENABLED: 0
        shell: bash
        run: |
          set -euo pipefail
          cd components/komarix-agent
          LDFLAGS="-s -w -X github.com/kkx999/KomariX/components/komarix-agent/update.CurrentVersion=${VERSION} -X github.com/kkx999/KomariX/components/komarix-agent/update.Repo=kkx999/KomariX"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o komarix-agent-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o komarix-agent-linux-arm64 .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Agent image
        uses: docker/build-push-action@v5
        with:
          context: components/komarix-agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/kkx999/komarix-agent:v1.0.1
            ghcr.io/kkx999/komarix-agent:latest
          provenance: false

  verify-final-release:
    needs: [publish, publish-panel-docker, publish-agent-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Verify release assets and latest channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --json tagName,isDraft,isPrerelease,targetCommitish,assets \
            > /tmp/release.json

          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > /tmp/latest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path("/tmp/release.json").read_text())
          latest = json.loads(Path("/tmp/latest.json").read_text())
          assets = {a["name"] for a in release["assets"]}

          panels = [n for n in assets if n.startswith("komarix-linux-") or n.startswith("komarix-windows-")]
          agents = [n for n in assets if n.startswith("komarix-agent-")]

          assert release["tagName"] == "v1.0.1"
          assert not release["isDraft"]
          assert not release["isPrerelease"]
          assert latest["tag_name"] == "v1.0.1", latest["tag_name"]
          assert len(panels) == 8, panels
          assert len(agents) == 14, agents
          assert "SHA256SUMS" in assets
          assert len(assets) == 24, len(assets)
          assert "komarix-frontends-v1.0.1.tar.gz" in assets
          assert "komarix-linux-amd64" in assets
          assert "komarix-agent-linux-amd64" in assets

          print("Verified v1.0.1:", len(assets), "assets; latest channel is v1.0.1")
          PY
