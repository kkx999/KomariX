name: Verify and publish KomariX v1.0.2
# retry: pinned dependency and TypeScript literal compatibility

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.0.2.yml"

permissions:
  contents: write
  packages: write

env:
  VERSION: v1.0.2

jobs:
  build-frontends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build vendored KomariX frontends
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: komarix-frontends

      - name: Audit runtime branding and ownership
        shell: bash
        run: |
          set -euxo pipefail

          test -f web/public/defaultTheme/dist/index.html
          test -f web/public/purcarteTheme/dist/index.html
          test -f web/public/purcarteTheme/komari-theme.json

          grep -q '"short": "PurCarte"' web/public/purcarteTheme/komari-theme.json
          grep -q 'KomariX Theme PurCarte' web/public/purcarteTheme/komari-theme.json

          if grep -R -F 'https://github.com/komari-monitor/komari' web/public/defaultTheme/dist web/public/purcarteTheme/dist; then
            echo "Found stale Komari project URL in built frontend."
            exit 1
          fi
          if grep -R -F 'https://api.github.com/repos/komari-monitor/komari/releases' web/public/defaultTheme/dist; then
            echo "Found stale Komari release API URL."
            exit 1
          fi
          if grep -R -F 'ghcr.io/komari-monitor/komari-agent' web/public/defaultTheme/dist; then
            echo "Found stale Komari Agent Docker image."
            exit 1
          fi
          if grep -R -F 'Komari Monitor' web/public/purcarteTheme/dist; then
            echo "Found stale PurCarte product branding."
            exit 1
          fi

          grep -q 'kkx999/KomariX' agent/install.sh
          grep -q 'kkx999/KomariX' agent/install.ps1
          if grep -F 'komari-monitor/komari-agent' agent/install.sh agent/install.ps1; then
            echo "Agent installer still depends on upstream Komari Agent repository."
            exit 1
          fi

  test-panel:
    needs: build-frontends
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore frontends
        uses: ./.github/actions/restore-frontend
        with:
          artifact-name: komarix-frontends

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run panel tests
        shell: bash
        run: |
          set -euo pipefail
          go list ./... | grep -v '^github.com/kkx999/KomariX/pkg/jsruntime$' | xargs go test

      - name: Build panel verification binary
        env:
          CGO_ENABLED: 1
          GIN_MODE: release
        run: |
          go build -trimpath \
            -ldflags="-s -w -X github.com/kkx999/KomariX/utils.CurrentVersion=${VERSION} -X github.com/kkx999/KomariX/utils.VersionHash=${GITHUB_SHA}" \
            -o /tmp/komarix-linux-amd64 .

  build-panel:
    needs: [build-frontends, test-panel]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux]
        goarch: [amd64, arm64, 386, riscv64]
        include:
          - goos: windows
            goarch: amd64
            zig_target_triple: x86_64-windows-gnu
            binary_extension: .exe
          - goos: windows
            goarch: arm64
            zig_target_triple: aarch64-windows-gnu
            binary_extension: .exe
          - goos: windows
            goarch: 386
            zig_target_triple: x86-windows-gnu
            binary_extension: .exe
          - goos: linux
            goarch: amd64
            zig_target_triple: x86_64-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: arm64
            zig_target_triple: aarch64-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: 386
            zig_target_triple: x86-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: riscv64
            zig_target_triple: riscv64-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: loong64
            zig_target_triple: loongarch64-linux-musl
            binary_extension: ""
        exclude:
          - goos: windows
            goarch: riscv64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore frontends
        uses: ./.github/actions/restore-frontend
        with:
          artifact-name: komarix-frontends

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Zig
        uses: ./.github/actions/setup-zig

      - name: Build panel
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target_triple }}
          GIN_MODE: release
        shell: bash
        run: |
          BINARY_NAME="komarix-${GOOS}-${GOARCH}${{ matrix.binary_extension }}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/kkx999/KomariX/utils.CurrentVersion=${VERSION} -X github.com/kkx999/KomariX/utils.VersionHash=${GITHUB_SHA}" \
            -o "$BINARY_NAME" .

      - name: Upload panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komarix-${{ matrix.goos }}-${{ matrix.goarch }}*

  build-agent:
    needs: test-panel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: components/komarix-agent/go.mod
          cache-dependency-path: components/komarix-agent/go.sum

      - name: Build KomariX Agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          cd components/komarix-agent
          BINARY_NAME="komarix-agent-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -trimpath \
            -ldflags="-s -w -X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari-agent/update.Repo=kkx999/KomariX" \
            -o "../../${BINARY_NAME}" .
          LEGACY_NAME="${BINARY_NAME/komarix-agent-/komari-agent-}"
          cp "../../${BINARY_NAME}" "../../${LEGACY_NAME}"

      - name: Upload Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komarix-agent-${{ matrix.goos }}-${{ matrix.goarch }}*

  publish:
    needs: [build-panel, build-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish v1.0.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          ls -al artifacts
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$VERSION already exists"
            exit 1
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "KomariX v1.0.2" \
            --notes "KomariX v1.0.2：完成独立化。内置并默认使用 PurCarte v1.2.5 的 KomariX 品牌版本；前端、Agent 与 PurCarte 源码已固定归档；Agent 安装与自更新改由 KomariX Release 提供；主题和插件市场默认使用 KomariX 镜像索引。保留 Komari 1.4.3 兼容逻辑与原始开源许可证。" \
            artifacts/komari*

  publish-agent-docker:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: components/komarix-agent/go.mod
          cache-dependency-path: components/komarix-agent/go.sum

      - name: Build Agent Docker binaries
        env:
          CGO_ENABLED: 0
        shell: bash
        run: |
          cd components/komarix-agent
          LDFLAGS="-s -w -X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari-agent/update.Repo=kkx999/KomariX"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o komari-agent-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o komari-agent-linux-arm64 .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push KomariX Agent image
        uses: docker/build-push-action@v5
        with:
          context: components/komarix-agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/kkx999/komarix-agent:v1.0.2
            ghcr.io/kkx999/komarix-agent:latest
          provenance: false
