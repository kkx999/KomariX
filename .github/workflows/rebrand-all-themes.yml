name: Rebrand all KomariX market themes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebrand-all-themes.yml"

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified original theme mirror
        uses: actions/download-artifact@v4
        with:
          name: komarix-theme-market-assets
          repository: kkx999/KomariX
          run-id: 35333099879
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/source-assets

      - name: Rebrand all 49 themes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rebranded-themes
          python3 scripts/rebrand_theme_packages.py \
            --assets /tmp/source-assets \
            --catalog market/theme-v1.json \
            --output-dir /tmp/rebranded-themes \
            --release-tag v1.0.0

      - name: Verify all 49 rebranded themes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_rebranded_themes.py \
            --source-assets /tmp/source-assets \
            --rebranded-assets /tmp/rebranded-themes \
            --source-catalog market/theme-v1.json \
            --rebranded-catalog /tmp/rebranded-themes/theme-v1.rebranded.json

          test "$(find /tmp/rebranded-themes -maxdepth 1 -type f -name 'theme-*.zip' | wc -l)" -eq 49
          test "$(find /tmp/rebranded-themes -maxdepth 1 -type f -name 'preview-*' | wc -l)" -eq 49

      - name: Upload frozen rebranded theme market
        uses: actions/upload-artifact@v4
        with:
          name: komarix-theme-market-rebranded-v1.0.0
          path: /tmp/rebranded-themes
          retention-days: 7

      - name: Activate rebranded market catalog
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          cp /tmp/rebranded-themes/theme-v1.rebranded.json market/theme-v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market/theme-v1.json
          if git diff --cached --quiet; then
            echo "Market catalog already matches rebranded packages."
            exit 0
          fi
          git commit -m "theme: activate 49 KomariX-rebranded market packages [skip ci]"
          git push origin HEAD:main

# retry-1
