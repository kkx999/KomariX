name: Verify and publish KomariX v1.0.0
# final-build-1
# retry: pinned dependency and TypeScript literal compatibility

on:
  push:
    branches:
      - main
    paths:
      - "release-v1.0.0.trigger"

permissions:
  contents: write
  packages: write

env:
  VERSION: v1.0.0

jobs:
  build-frontends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build vendored KomariX frontends
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: komarix-frontends

      - name: Audit runtime branding and ownership
        shell: bash
        run: |
          set -euxo pipefail

          test -f web/public/defaultTheme/dist/index.html
          test -f web/public/purcarteTheme/dist/index.html
          test -f web/public/purcarteTheme/komarix-theme.json

          grep -q '"short": "PurCarte"' web/public/purcarteTheme/komarix-theme.json
          grep -q 'KomariX Theme PurCarte' web/public/purcarteTheme/komarix-theme.json

          if grep -R -F 'https://github.com/komari-monitor/komari' web/public/defaultTheme/dist web/public/purcarteTheme/dist; then
            echo "Found stale Komari project URL in built frontend."
            exit 1
          fi
          if grep -R -F 'https://api.github.com/repos/komari-monitor/komari/releases' web/public/defaultTheme/dist; then
            echo "Found stale Komari release API URL."
            exit 1
          fi
          if grep -R -F 'ghcr.io/komari-monitor/komari-agent' web/public/defaultTheme/dist; then
            echo "Found stale Komari Agent Docker image."
            exit 1
          fi
          if grep -R -F 'Komari Monitor' web/public/purcarteTheme/dist; then
            echo "Found stale PurCarte product branding."
            exit 1
          fi

          grep -q 'kkx999/KomariX' agent/install.sh
          grep -q 'kkx999/KomariX' agent/install.ps1
          if grep -F 'komari-monitor/komari-agent' agent/install.sh agent/install.ps1; then
            echo "Agent installer still depends on upstream Komari Agent repository."
            exit 1
          fi

  test-panel:
    needs: build-frontends
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore frontends
        uses: ./.github/actions/restore-frontend
        with:
          artifact-name: komarix-frontends

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run panel tests
        shell: bash
        run: |
          set -euo pipefail
          go list ./... | grep -v '^github.com/kkx999/KomariX/pkg/jsruntime$' | xargs go test

      - name: Build panel verification binary
        env:
          CGO_ENABLED: 1
          GIN_MODE: release
        run: |
          go build -trimpath \
            -ldflags="-s -w -X github.com/kkx999/KomariX/utils.CurrentVersion=${VERSION} -X github.com/kkx999/KomariX/utils.VersionHash=${GITHUB_SHA}" \
            -o /tmp/komarix-linux-amd64 .

  build-panel:
    needs: [build-frontends, test-panel]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux]
        goarch: [amd64, arm64, 386, riscv64]
        include:
          - goos: windows
            goarch: amd64
            zig_target_triple: x86_64-windows-gnu
            binary_extension: .exe
          - goos: windows
            goarch: arm64
            zig_target_triple: aarch64-windows-gnu
            binary_extension: .exe
          - goos: windows
            goarch: 386
            zig_target_triple: x86-windows-gnu
            binary_extension: .exe
          - goos: linux
            goarch: amd64
            zig_target_triple: x86_64-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: arm64
            zig_target_triple: aarch64-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: 386
            zig_target_triple: x86-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: riscv64
            zig_target_triple: riscv64-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: loong64
            zig_target_triple: loongarch64-linux-musl
            binary_extension: ""
        exclude:
          - goos: windows
            goarch: riscv64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore frontends
        uses: ./.github/actions/restore-frontend
        with:
          artifact-name: komarix-frontends

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Zig
        uses: ./.github/actions/setup-zig

      - name: Build panel
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target_triple }}
          GIN_MODE: release
        shell: bash
        run: |
          BINARY_NAME="komarix-${GOOS}-${GOARCH}${{ matrix.binary_extension }}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/kkx999/KomariX/utils.CurrentVersion=${VERSION} -X github.com/kkx999/KomariX/utils.VersionHash=${GITHUB_SHA}" \
            -o "$BINARY_NAME" .

      - name: Upload panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komarix-${{ matrix.goos }}-${{ matrix.goarch }}*

  build-agent:
    needs: test-panel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: components/komarix-agent/go.mod
          cache-dependency-path: components/komarix-agent/go.sum

      - name: Build KomariX Agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          cd components/komarix-agent
          BINARY_NAME="komarix-agent-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -trimpath \
            -ldflags="-s -w -X github.com/kkx999/KomariX/components/komarix-agent/update.CurrentVersion=${VERSION} -X github.com/kkx999/KomariX/components/komarix-agent/update.Repo=kkx999/KomariX" \
            -o "../../${BINARY_NAME}" .

      - name: Upload Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komarix-agent-${{ matrix.goos }}-${{ matrix.goarch }}*

  publish:
    needs: [build-panel, build-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Download verified KomariX-rebranded theme market
        uses: actions/download-artifact@v4
        with:
          name: komarix-theme-market-rebranded-v1.0.0
          repository: kkx999/KomariX
          run-id: 35336891764
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: theme-assets

      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          ls -al artifacts
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Replacing existing $VERSION release with final rebranded build."
            gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "KomariX v1.0.0" \
            --notes "KomariX v1.0.0：首个正式独立版本。面板、Agent、默认 PurCarte 与市场资源均由 KomariX 自行维护；49 个主题安装包已逐个完成 KomariX 品牌处理并重新校验 SHA256，作者署名与 LICENSE/NOTICE 保持原样；49 张主题预览与主题安装包均托管于本 Release。插件市场使用 KomariX 镜像索引。项目来源说明见 README。" \
            artifacts/komarix-linux-* \
            artifacts/komarix-windows-* \
            artifacts/komarix-agent-* \
            theme-assets/theme-*.zip \
            theme-assets/preview-*


  publish-agent-docker:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: components/komarix-agent/go.mod
          cache-dependency-path: components/komarix-agent/go.sum

      - name: Build Agent Docker binaries
        env:
          CGO_ENABLED: 0
        shell: bash
        run: |
          cd components/komarix-agent
          LDFLAGS="-s -w -X github.com/kkx999/KomariX/components/komarix-agent/update.CurrentVersion=${VERSION} -X github.com/kkx999/KomariX/components/komarix-agent/update.Repo=kkx999/KomariX"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o komarix-agent-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o komarix-agent-linux-arm64 .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push KomariX Agent image
        uses: docker/build-push-action@v5
        with:
          context: components/komarix-agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/kkx999/komarix-agent:v1.0.0
            ghcr.io/kkx999/komarix-agent:latest
          provenance: false



  verify-final-release:
    needs: [publish, publish-agent-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Verify final v1.0.0 assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,targetCommitish,assets \
            > /tmp/release.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          r=json.loads(Path("/tmp/release.json").read_text())
          assets={a["name"] for a in r["assets"]}

          panels=[n for n in assets if n.startswith("komarix-linux-") or n.startswith("komarix-windows-")]
          agents=[n for n in assets if n.startswith("komarix-agent-")]
          themes=[n for n in assets if n.startswith("theme-") and n.endswith(".zip")]
          previews=[n for n in assets if n.startswith("preview-")]

          assert r["tagName"] == "v1.0.0"
          assert not r["isDraft"]
          assert not r["isPrerelease"]
          assert len(panels) == 8, len(panels)
          assert len(agents) == 14, len(agents)
          assert len(themes) == 49, len(themes)
          assert len(previews) == 49, len(previews)
          assert len(assets) == 120, len(assets)
          print("Final release verified:", len(assets), "assets")
          PY

  cleanup-old-releases:
    needs: verify-final-release
    runs-on: ubuntu-latest
    steps:
      - name: Keep only KomariX v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v1.0.2 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == true and (.tagName | startswith("Snapshot-"))) | .tagName' \
            | while read -r tag; do
                [ -n "$tag" ] || continue
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
