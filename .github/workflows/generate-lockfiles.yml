name: Generate frontend lockfiles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-lockfiles.yml"
      - "components/komarix-web/package.json"
      - "components/komarix-theme-purcarte/package.json"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lockfiles
        run: |
          set -euxo pipefail
          npm install --package-lock-only --ignore-scripts --prefix components/komarix-web
          npm install --package-lock-only --ignore-scripts --prefix components/komarix-theme-purcarte
          npm audit fix --package-lock-only --ignore-scripts --prefix components/komarix-theme-purcarte
          npm audit --audit-level=high --prefix components/komarix-web
          npm audit --audit-level=high --prefix components/komarix-theme-purcarte
      - name: Commit lockfiles
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/komarix-web/package-lock.json components/komarix-theme-purcarte/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: lock frontend dependencies"
          git push
