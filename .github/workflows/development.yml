name: Development Environment

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-binaries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      #- name: Create dummy index.html
      #  run: |
      #    mkdir -p web/public/defaultTheme/dist
      #    echo "<html><body><h1>This is KomariX development server.</h1></body></html>" > web/public/defaultTheme/dist/index.html

      - name: Clone and build frontend
        uses: ./.github/actions/build-frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build application
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          VERSION_SHA="${{ github.sha }}"
          go build -ldflags "-X github.com/kkx999/KomariX/utils.CurrentVersion=dev -X github.com/kkx999/KomariX/utils.VersionHash=${VERSION_SHA}" -o komarix .

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: komarix
          path: komarix

  deploy-to-production:
    needs: build-binaries
    runs-on: ubuntu-latest
    env:
      PRODUCTION_SERVER: ${{ vars.PRODUCTION_SERVER }}
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: komarix

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add host to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.PRODUCTION_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to production
        run: |
          chmod +x komarix
          ssh root@${{ env.PRODUCTION_SERVER }} 'mkdir -p /opt/komarix/'
          ssh root@${{ env.PRODUCTION_SERVER }} 'systemctl stop komarix.service || true'
          ssh root@${{ env.PRODUCTION_SERVER }} 'rm -f /opt/komarix/komarix.old'
          ssh root@${{ env.PRODUCTION_SERVER }} 'mv /opt/komarix/komarix /opt/komarix/komarix.old || true'
          scp komarix root@${{ env.PRODUCTION_SERVER }}:/opt/komarix/komari
          ssh root@${{ env.PRODUCTION_SERVER }} 'systemctl start komarix.service'
