name: Audit all market theme branding

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-theme-branding.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified theme market mirror
        uses: actions/download-artifact@v4
        with:
          name: komarix-theme-market-assets
          repository: kkx999/KomariX
          run-id: 35333099879
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/theme-assets

      - name: Audit all 49 theme packages
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_theme_branding.py \
            --assets /tmp/theme-assets \
            --output /tmp/theme-branding-audit.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: theme-branding-audit
          path: /tmp/theme-branding-audit.json
          retention-days: 3
