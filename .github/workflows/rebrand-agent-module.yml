name: Rebrand KomariX Agent module

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rebrand-agent-module.yml"

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite Agent module path
        shell: bash
        run: |
          set -euxo pipefail
          mapfile -t files < <(grep -RIl --exclude=LICENSE --exclude=NOTICE             'github.com/komari-monitor/komari-agent' components/komarix-agent || true)
          if [ "${#files[@]}" -gt 0 ]; then
            sed -i               's#github.com/komari-monitor/komari-agent#github.com/kkx999/KomariX/components/komarix-agent#g'               "${files[@]}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/komarix-agent
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "agent: move Go module identity to KomariX [skip ci]"
          git push origin HEAD:main
