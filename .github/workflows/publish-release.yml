name: Verify and publish KomariX release
run-name: Publish KomariX ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New stable release version, for example v1.0.8"
        required: true
        type: string
      release_notes:
        description: "Optional release summary. Leave empty to use the matching CHANGELOG section."
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate new stable version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be a stable semantic version such as v1.0.8."
            exit 1
          fi
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists. Use Rebuild Existing Release instead."
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists. Refusing to overwrite release history."
            exit 1
          fi

  build-frontends:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build KomariX frontend
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: komarix-frontends-${{ inputs.version }}

  test-panel:
    needs: build-frontends
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore frontend
        uses: ./.github/actions/restore-frontend
        with:
          artifact-name: komarix-frontends-${{ inputs.version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run panel tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n install-komarix.sh components/komarix-agent/install.sh agent/install.sh
          cmp components/komarix-agent/install.sh agent/install.sh
          cmp components/komarix-agent/install.ps1 agent/install.ps1
          pwsh -NoProfile -Command '
            $files = @("components/komarix-agent/install.ps1", "agent/install.ps1")
            foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Error $_.Message }
                exit 1
              }
            }
          '
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go list ./... | grep -v '^github.com/kkx999/KomariX/pkg/jsruntime$' | xargs go test

      - name: Build panel verification binary
        env:
          CGO_ENABLED: 1
          GIN_MODE: release
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath \
            -ldflags="-s -w -X github.com/kkx999/KomariX/utils.CurrentVersion=${VERSION} -X github.com/kkx999/KomariX/utils.VersionHash=${GITHUB_SHA}" \
            -o /tmp/komarix-linux-amd64 .

  test-agent:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: components/komarix-agent/go.mod
          cache: false

      - name: Run Agent tests
        shell: bash
        run: |
          set -euo pipefail
          cd components/komarix-agent
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...

      - name: Verify remote control removal
        shell: bash
        run: |
          set -euo pipefail
          test ! -e components/komarix-web/src/pages/admin/exec.tsx
          test ! -d components/komarix-web/src/pages/terminal
          test ! -d components/komarix-agent/terminal
          test ! -d web/api/terminal
          test ! -e web/rpc/jsonrpc/admin.task.go
          test ! -e web/rpc/jsonrpc/admin.xtermjs.go
          test ! -e components/komarix-agent/server/files.go
          test ! -e components/komarix-agent/server/file_stream.go
          test ! -e components/komarix-agent/server/files_unix.go
          test ! -e components/komarix-agent/server/files_windows.go
          test ! -e components/komarix-agent/cmd/warn.go
          test ! -e components/komarix-agent/cmd/warn_linux.go
          test ! -e components/komarix-agent/cmd/warn_linux_test.go
          test ! -e components/komarix-agent/cmd/warn_other.go
          test ! -e components/komarix-agent/cmd/warn_windows.go
          test ! -e components/komarix-agent/cmd/warning.go
          if grep -Eq 'disable-web-ssh|DisableWebSsh|disable_web_ssh|AGENT_DISABLE_WEB_SSH|show-warning|ShowWarning|AGENT_SHOW_WARNING' \
              components/komarix-agent/cmd/root.go \
              components/komarix-agent/cmd/flags/flag.go \
              components/komarix-agent/readme.md \
              components/komarix-web/src/components/admin/NodeTable/NodeFunction.tsx; then
            echo "Obsolete remote-control option remains."
            exit 1
          fi
          if grep -Eq 'MethodAgentFile|agent\.file|FileOperation|FileResult|handleFileOperation' \
              components/komarix-agent/protocol/v2/jsonrpc.go \
              components/komarix-agent/server/websocket.go; then
            echo "Remote file-management protocol residue remains."
            exit 1
          fi
          if grep -Eq 'MethodAgentTaskResult|MethodAgentExec|MethodAgentTerminal|ExecParams|TerminalRequestParams|agent\.exec|agent\.terminal|agent\.taskResult' \
              protocol/v2/jsonrpc.go; then
            echo "Panel remote-command protocol residue remains."
            exit 1
          fi
          if grep -Eq '/terminal\?uuid|<Terminal' components/komarix-web/src/components/admin/NodeTable/NodeFunction.tsx; then
            echo "Obsolete terminal action remains."
            exit 1
          fi
          if grep -q '"@xterm/' components/komarix-web/package.json; then
            echo "Obsolete xterm dependency remains."
            exit 1
          fi
          if grep -Eq 'UserExistsError/conpty|creack/pty|gopkg.in/toast.v1' components/komarix-agent/go.mod; then
            echo "Obsolete remote-control dependency remains."
            exit 1
          fi
          test -f components/komarix-web/package-lock.json
          test -f components/komarix-theme-purcarte/package-lock.json

  build-panel:
    needs: [build-frontends, test-panel]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            zig_target_triple: x86_64-windows-gnu
            binary_extension: .exe
          - goos: windows
            goarch: arm64
            zig_target_triple: aarch64-windows-gnu
            binary_extension: .exe
          - goos: windows
            goarch: 386
            zig_target_triple: x86-windows-gnu
            binary_extension: .exe
          - goos: linux
            goarch: amd64
            zig_target_triple: x86_64-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: arm64
            zig_target_triple: aarch64-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: 386
            zig_target_triple: x86-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: riscv64
            zig_target_triple: riscv64-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: loong64
            zig_target_triple: loongarch64-linux-musl
            binary_extension: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore frontend
        uses: ./.github/actions/restore-frontend
        with:
          artifact-name: komarix-frontends-${{ inputs.version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Zig
        uses: ./.github/actions/setup-zig

      - name: Build panel
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target_triple }}
          GIN_MODE: release
        shell: bash
        run: |
          set -euo pipefail
          BINARY_NAME="komarix-${GOOS}-${GOARCH}${{ matrix.binary_extension }}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/kkx999/KomariX/utils.CurrentVersion=${VERSION} -X github.com/kkx999/KomariX/utils.VersionHash=${GITHUB_SHA}" \
            -o "${BINARY_NAME}" .

      - name: Upload panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komarix-${{ matrix.goos }}-${{ matrix.goarch }}*

  build-agent:
    needs: test-agent
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: components/komarix-agent/go.mod
          cache: false

      - name: Build Agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          set -euo pipefail
          cd components/komarix-agent
          BINARY_NAME="komarix-agent-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -trimpath \
            -ldflags="-s -w -X github.com/kkx999/KomariX/components/komarix-agent/update.CurrentVersion=${VERSION} -X github.com/kkx999/KomariX/components/komarix-agent/update.Repo=kkx999/KomariX" \
            -o "../../${BINARY_NAME}" .

      - name: Upload Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komarix-agent-${{ matrix.goos }}-${{ matrix.goarch }}*

  publish:
    needs: [build-panel, build-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum komarix-* | sort -k2 > SHA256SUMS

      - name: Publish formal release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists. Refusing to overwrite release history."
            exit 1
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"].strip()
          supplied = os.environ.get("RELEASE_NOTES", "").strip()
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          summary = supplied
          if not summary:
              marker = f"## {version}"
              lines = changelog.splitlines()
              try:
                  start = lines.index(marker) + 1
              except ValueError:
                  start = -1
              if start >= 0:
                  picked = []
                  for line in lines[start:]:
                      if line.startswith("## "):
                          break
                      picked.append(line)
                  summary = "\n".join(picked).strip()
          if not summary:
              summary = f"KomariX {version} 正式版本，详见 CHANGELOG.md。"

          body = "<!-- komarix-prebuilt-release -->\n\n" + summary + "\n"
          Path("/tmp/release-notes.md").write_text(body, encoding="utf-8")
          PY

          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "KomariX ${VERSION}" \
            --notes-file /tmp/release-notes.md \
            artifacts/komarix-* \
            artifacts/SHA256SUMS

  publish-panel-docker:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux panel binaries
        uses: actions/download-artifact@v4
        with:
          pattern: panel-linux-*
          path: .
          merge-multiple: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push panel image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/kkx999/komarix:${{ inputs.version }}
            ghcr.io/kkx999/komarix:latest
          provenance: false

  publish-agent-docker:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: components/komarix-agent/go.mod
          cache: false

      - name: Build Agent Docker binaries
        env:
          CGO_ENABLED: 0
        shell: bash
        run: |
          set -euo pipefail
          cd components/komarix-agent
          LDFLAGS="-s -w -X github.com/kkx999/KomariX/components/komarix-agent/update.CurrentVersion=${VERSION} -X github.com/kkx999/KomariX/components/komarix-agent/update.Repo=kkx999/KomariX"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o komarix-agent-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o komarix-agent-linux-arm64 .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Agent image
        uses: docker/build-push-action@v5
        with:
          context: components/komarix-agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/kkx999/komarix-agent:${{ inputs.version }}
            ghcr.io/kkx999/komarix-agent:latest
          provenance: false

  verify-final-release:
    needs: [publish, publish-panel-docker, publish-agent-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Verify release assets and latest channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --json tagName,isDraft,isPrerelease,targetCommitish,assets \
            > /tmp/release.json

          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > /tmp/latest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path("/tmp/release.json").read_text())
          latest = json.loads(Path("/tmp/latest.json").read_text())
          assets = {a["name"] for a in release["assets"]}

          panels = [n for n in assets if n.startswith("komarix-linux-") or n.startswith("komarix-windows-")]
          agents = [n for n in assets if n.startswith("komarix-agent-")]

          import os
          expected = os.environ["VERSION"]
          assert release["tagName"] == expected
          assert not release["isDraft"]
          assert not release["isPrerelease"]
          assert latest["tag_name"] == expected, latest["tag_name"]
          assert len(panels) == 8, panels
          assert len(agents) == 14, agents
          assert "SHA256SUMS" in assets
          assert len(assets) == 24, len(assets)
          assert f"komarix-frontends-{expected}.tar.gz" in assets
          assert "komarix-linux-amd64" in assets
          assert "komarix-agent-linux-amd64" in assets

          print("Verified", expected + ":", len(assets), "assets; latest channel is", expected)
          PY
